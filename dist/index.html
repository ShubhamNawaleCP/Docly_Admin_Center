<div class="toast" id="toast" role="status"></div>
<script>
  const icons={search:'<svg viewBox="0 0 20 20" fill="none"><circle cx="8.7" cy="8.7" r="5.6" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',plus:'<svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',cloud:'<svg viewBox="0 0 20 20" fill="none"><path d="M5.3 15.5h9.2a3 3 0 0 0 .5-6 5.1 5.1 0 0 0-9.8-1.2 3.6 3.6 0 0 0 .1 7.2Z" stroke="currentColor" stroke-width="1.5"/><path d="M10 10v6m-2.2-2.1L10 16l2.2-2.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',box:'<svg viewBox="0 0 20 20" fill="none"><path d="m10 2.8 6.5 3.5v7.4L10 17.2l-6.5-3.5V6.3L10 2.8Z" stroke="currentColor" stroke-width="1.5"/><path d="m3.8 6.5 6.2 3.4 6.2-3.4M10 10v6.7" stroke="currentColor" stroke-width="1.3"/></svg>',building:'<svg viewBox="0 0 20 20" fill="none"><path d="M3 17V6.5L10 3l7 3.5V17H3Z" stroke="currentColor" stroke-width="1.5"/><path d="M7 17v-4h6v4M6.5 8.5h.01M10 8.5h.01M13.5 8.5h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',check:'<svg viewBox="0 0 20 20" fill="none"><path d="m4 10.5 4 4 8-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
  const defaultOrgs=[{name:'Acme Manufacturing',domain:'acme-manufacturing.my.salesforce.com',env:'Production',user:'admin@acme.com',connected:'Oct 24, 2026',avatar:'AM'},{name:'Northstar Logistics',domain:'northstar--uat.sandbox.my.salesforce.com',env:'Sandbox',user:'sf.admin@northstar.com',connected:'Oct 21, 2026',avatar:'NL'},{name:'Pioneer Health Group',domain:'pioneerhealth.my.salesforce.com',env:'Production',user:'crm.ops@pioneerhealth.com',connected:'Oct 18, 2026',avatar:'PH'}];
  const defaultInstalls=[{pkg:'Service Toolkit',version:'2.4.1',org:'Acme Manufacturing',date:'Oct 28, 2026 · 10:42 AM',status:'Succeeded',user:'Jordan Davis'},{pkg:'Data Sync Connector',version:'1.8.0',org:'Northstar Logistics',date:'Oct 27, 2026 · 3:16 PM',status:'Succeeded',user:'Morgan Lee'},{pkg:'Service Toolkit',version:'2.4.1',org:'Pioneer Health Group',date:'Oct 26, 2026 · 9:08 AM',status:'In progress',user:'Jordan Davis'},{pkg:'Reporting Extension',version:'1.2.3',org:'Northstar Logistics',date:'Oct 24, 2026 · 4:51 PM',status:'Failed',user:'Morgan Lee'}];
  let orgs=JSON.parse(localStorage.getItem('orgpilot-orgs')||'null')||defaultOrgs;let installs=JSON.parse(localStorage.getItem('orgpilot-installs')||'null')||defaultInstalls;let page='overview';let filter='';
  const content=document.getElementById('content');
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function head(title,subtitle,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="head-actions">${actions}</div></div>`}
  function btn(label,kind='secondary',id='',icon=''){return `<button class="btn ${kind==='primary'?'btn-primary':''}" ${id?`id="${id}"`:''}>${icon?icons[icon]:''}${label}</button>`}
  function badge(status){let c=status==='Succeeded'?'success':status==='Failed'?'failed':status==='In progress'?'pending':'neutral';return `<span class="status status-${c}">${esc(status)}</span>`}
  function orgIcon(){return `<span class="org-icon">${icons.building}</span>`}
  function installRows(rows){return rows.map(i=>`<tr><td><div class="product-cell"><span class="package-glyph">${icons.box}</span><span><strong>${esc(i.pkg)}</strong><small>v${esc(i.version)}</small></span></div></td><td><div class="org-cell">${orgIcon()}<span><strong>${esc(i.org)}</strong><small>${esc((orgs.find(o=>o.name===i.org)||{}).env||'Salesforce org')}</small></span></div></td><td>${badge(i.status)}</td><td>${esc(i.date)}</td><td>${esc(i.user)}</td><td><button class="icon-btn row-menu" aria-label="More options">···</button></td></tr>`).join('')}
  function table(rows,compact=false){return `<div class="table-wrap"><table class="table"><thead><tr><th>Package</th><th>Salesforce org</th><th>Status</th><th>${compact?'Started':'Date & time'}</th><th>Initiated by</th><th></th></tr></thead><tbody>${rows.length?installRows(rows):`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">${icons.box}</div><h3>No installs found</h3><p>Installs will appear here once they are started.</p></div></td></tr>`}</tbody></table></div>`}
  function overview(){return `${head('Overview','Monitor package installs and Salesforce org connections across your workspace.',btn('Connect an org','secondary','connect-btn','plus'))}<section class="grid stats"><div class="stat-card"><div class="stat-label">Connected orgs ${icons.building}</div><div class="stat-number">${orgs.length}</div><div class="stat-note"><span class="up">${orgs.filter(o=>o.env==='Production').length} production</span> · ${orgs.filter(o=>o.env==='Sandbox').length} sandbox</div></div><div class="stat-card"><div class="stat-label">Installations this month ${icons.box}</div><div class="stat-number">${installs.filter(i=>i.status==='Succeeded').length+12}</div><div class="stat-note"><span class="up">↑ 18%</span> from last month</div></div><div class="stat-card"><div class="stat-label">Successful installs ${icons.check}</div><div class="stat-number">98.4%</div><div class="stat-note">Across all connected orgs</div></div><div class="stat-card"><div class="stat-label">Available packages ${icons.box}</div><div class="stat-number">3</div><div class="stat-note">2 updates available</div></div></section><section class="grid cols"><div class="panel"><div class="panel-head"><div><div class="panel-title">Recent installations</div><div class="panel-subtitle">Latest package activity across your orgs</div></div><div class="panel-head-actions"><a href="#installs" class="text-link" data-page="installs">View all</a></div></div>${table(installs.slice(0,4),true)}<div class="table-footer"><span>Showing ${Math.min(4,installs.length)} of ${installs.length} installations</span><a class="text-link" href="#installs" data-page="installs">Full history →</a></div></div><div><div class="panel"><div class="panel-head"><div><div class="panel-title">Connected orgs</div><div class="panel-subtitle">${orgs.length} Salesforce environments</div></div><div class="panel-head-actions"><a class="text-link" href="#orgs" data-page="orgs">Manage</a></div></div><div class="recent-list">${orgs.slice(0,3).map(o=>`<div class="recent-item"><span class="recent-icon">${icons.building}</span><div class="recent-copy"><strong>${esc(o.name)}</strong><p>${esc(o.env)} · ${esc(o.user)}</p><time>Connected ${esc(o.connected)}</time></div></div>`).join('')}</div></div><div class="release-card"><div class="release-top"><span class="package-glyph">${icons.box}</span><strong>Service Toolkit <span style="font-weight:450;color:#76839a">v2.5.0</span></strong><span class="status status-pending" style="margin-left:auto">Update</span></div><p>A new version is available with performance improvements and additional report types.</p><div class="release-meta"><span>Released Oct 25, 2026</span><a href="#packages" class="text-link" data-page="packages">Review update</a></div></div></div></section>`}
  const packages=[{name:'Service Toolkit',version:'2.4.1',tag:'Managed · Production ready',desc:'Core service workflows, guided setup, and service team productivity tools.',icon:'S',color:'#eaf1ff'},{name:'Data Sync Connector',version:'1.8.0',tag:'Managed · Production ready',desc:'Reliable synchronization between Salesforce and your connected data sources.',icon:'D',color:'#eaf7f2'},{name:'Reporting Extension',version:'1.2.3',tag:'Managed · Production ready',desc:'Expanded dashboards and reporting components for your Salesforce org.',icon:'R',color:'#fff2e8'}];
  function packagePage(){let list=packages.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()));return `${head('Packages','Browse and manage package versions available to your workspace.',btn('Add package','primary','add-package', 'plus'))}<div class="page-toolbar"><label class="search">${icons.search}<input id="search-input" placeholder="Search packages" value="${esc(filter)}" /></label><select class="select" id="package-filter"><option>All package types</option><option>Managed</option></select><span style="margin-left:auto;color:var(--muted);font-size:11px">${list.length} packages</span></div><section class="grid cards">${list.map(p=>`<article class="package-card"><div class="package-card-head"><span class="package-logo" style="background:${p.color};font-size:15px;font-weight:650">${p.icon}</span><div><h3>${p.name}</h3><div class="version">Latest version ${p.version}</div></div><button class="icon-btn" style="margin-left:auto" aria-label="Package options">···</button></div><p>${p.desc}</p><div class="package-card-foot"><span class="package-tag">${p.tag}</span><button class="btn" data-install-package="${p.name}">Install</button></div></article>`).join('')||'<div class="panel empty-state">No packages match your search.</div>'}</section><div class="panel section-gap"><div class="panel-head"><div><div class="panel-title">Recently installed packages</div><div class="panel-subtitle">Package installs from the last 30 days</div></div></div>${table(installs.slice(0,3))}</div>`}
  function orgPage(){return `${head('Connected orgs','Connect and manage the Salesforce environments used for package installs.',btn('Connect an org','primary','connect-btn','plus'))}<div class="notice" style="margin-bottom:16px"><strong>Salesforce connection is not configured.</strong> These sample orgs are for preview only. Configure OAuth on the server before connecting customer orgs.</div><section class="grid org-cards">${orgs.map(o=>`<article class="org-card"><div class="org-card-top">${orgIcon()}<div><h3>${esc(o.name)}</h3><div class="org-id">${esc(o.domain)}</div></div><button class="icon-btn more" aria-label="Org actions">···</button></div><div class="org-details"><div><div class="detail-label">Environment</div><div class="detail-value">${badge(o.env)}</div></div><div><div class="detail-label">Connected by</div><div class="detail-value">${esc(o.user)}</div></div><div><div class="detail-label">Last connected</div><div class="detail-value">${esc(o.connected)}</div></div><div><div class="detail-label">Installations</div><div class="detail-value">${installs.filter(i=>i.org===o.name).length+4}</div></div></div><div class="org-card-actions"><span class="detail-label">${icons.check} <span style="color:var(--green)">Connection healthy</span></span><button class="btn" data-install-to-org="${esc(o.name)}">Install package</button></div></article>`).join('')}<button class="org-card" id="add-org-card" style="display:flex;align-items:center;justify-content:center;gap:9px;min-height:190px;color:#64748b;border-style:dashed;background:#fbfcfe">${icons.plus}<span style="font-size:12px;font-weight:550">Connect another org</span></button></section>`}
  function installPage(){let list=installs.filter(i=>`${i.pkg} ${i.org} ${i.user} ${i.status}`.toLowerCase().includes(filter.toLowerCase()));return `${head('Install history','A complete record of package installations across connected Salesforce orgs.',btn('Install package','primary','install-btn','plus'))}<div class="page-toolbar"><label class="search">${icons.search}<input id="search-input" placeholder="Search by package or org" value="${esc(filter)}" /></label><select class="select" id="status-filter"><option>All statuses</option><option>Succeeded</option><option>In progress</option><option>Failed</option></select><select class="select"><option>All orgs</option>${orgs.map(o=>`<option>${esc(o.name)}</option>`).join('')}</select><span style="margin-left:auto;color:var(--muted);font-size:11px">${list.length} records</span></div><div class="panel">${table(list)}<div class="table-footer"><span>Showing ${list.length} of ${installs.length} installations</span><span>Records retained for 12 months</span></div></div>`}
  function teamPage(){return `${head('Team & roles','Manage workspace access and control who can install packages.',btn('Invite member','primary','invite-btn','plus'))}<div class="panel"><div class="panel-head"><div><div class="panel-title">Workspace members</div><div class="panel-subtitle">3 members · Role changes apply immediately</div></div><div class="panel-head-actions"><label class="search" style="width:220px">${icons.search}<input placeholder="Search members" /></label></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Role</th><th>Access</th><th>Last active</th><th></th></tr></thead><tbody><tr><td><div class="org-cell"><span class="avatar">JD</span><span><strong>Jordan Davis</strong><small>jordan@acmecloud.com</small></span></div></td><td><span class="role">Owner</span></td><td>All permissions</td><td>Just now</td><td><button class="icon-btn">···</button></td></tr><tr><td><div class="org-cell"><span class="avatar" style="background:#e9f6ef;color:#28714f">ML</span><span><strong>Morgan Lee</strong><small>morgan@acmecloud.com</small></span></div></td><td><span class="role">Admin</span></td><td>Manage orgs, packages, installs</td><td>2 hours ago</td><td><button class="icon-btn">···</button></td></tr><tr><td><div class="org-cell"><span class="avatar" style="background:#f7eafa;color:#754d89">SP</span><span><strong>Sam Patel</strong><small>sam@acmecloud.com</small></span></div></td><td><span class="role">Installer</span></td><td>Install packages, view history</td><td>Yesterday</td><td><button class="icon-btn">···</button></td></tr></tbody></table></div><div class="table-footer">Role permissions are managed in workspace settings.</div></div><div class="grid cards section-gap" style="grid-template-columns:repeat(3,1fr)"><div class="panel" style="padding:16px"><span class="role">Admin</span><p style="font-size:11px;color:#647189;line-height:1.7;margin:13px 0 0">Manage members, connect orgs, add packages, and start or review installations.</p></div><div class="panel" style="padding:16px"><span class="role">Installer</span><p style="font-size:11px;color:#647189;line-height:1.7;margin:13px 0 0">Start package installs in connected orgs and view installation history.</p></div><div class="panel" style="padding:16px"><span class="role">Viewer</span><p style="font-size:11px;color:#647189;line-height:1.7;margin:13px 0 0">Browse the package catalog and view connected orgs and install history.</p></div></div>`}
  function settingsPage(){return `${head('Settings','Configure workspace details, integrations, and install defaults.') }<div class="settings-layout"><nav class="settings-nav"><button class="active">General</button><button>Salesforce connection</button><button>Install defaults</button><button>Security</button><button>Notifications</button></nav><section><div class="panel"><div class="panel-head"><div><div class="panel-title">Workspace details</div><div class="panel-subtitle">Basic information about your OrgPilot workspace</div></div></div><div class="settings-form"><div class="field"><label>Workspace name</label><input value="Acme Cloud" /><div class="field-help">This name is visible to all members of your workspace.</div></div><div class="field"><label>Workspace URL</label><input value="acme-cloud.orgpilot.app" /><div class="field-help">Your workspace's unique address.</div></div><div class="field"><label>Default environment</label><select><option>Production</option><option>Sandbox</option></select></div><button class="btn btn-primary" id="save-settings">Save changes</button></div></div><div class="panel section-gap"><div class="panel-head"><div><div class="panel-title">Salesforce integration</div><div class="panel-subtitle">OAuth credentials are stored securely on the server.</div></div><span class="status status-neutral" style="margin-left:auto">Not configured</span></div><div class="settings-form"><div class="notice">Add Salesforce OAuth credentials to the deployment environment to enable org connections. Never place the client secret in browser code.</div><div class="field"><label>OAuth client ID</label><input disabled placeholder="Not configured" /></div><div class="field"><label>Callback URL</label><input disabled value="https://orgpilot.app/auth/salesforce/callback" /></div><button class="btn" id="oauth-docs">View setup guide</button></div></div></section></div>`}
  const pages={overview:['Overview',overview],packages:['Packages',packagePage],orgs:['Connected orgs',orgPage],installs:['Install history',installPage],team:['Team & roles',teamPage],settings:['Settings',settingsPage]};
  function render(){if(!pages[page])page='overview';document.getElementById('crumb').textContent=pages[page][0];document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.page===page));content.innerHTML=pages[page][1]();bind();}
  let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
  function modal(title,subtitle,body,footer){document.getElementById('modal').innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div><button class="modal-close" aria-label="Close dialog" id="close-modal">×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div>`;document.getElementById('overlay').classList.add('show');document.getElementById('close-modal').onclick=closeModal;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()}}
  function closeModal(){document.getElementById('overlay').classList.remove('show')}
  function connectModal(){modal('Connect a Salesforce org','Choose an environment to connect to your workspace.',`<div class="notice"><strong>Salesforce OAuth setup is pending.</strong> Add the connected app's client ID and callback configuration on the server before connecting a real org. The client secret must remain server-side.</div><div class="field"><label>Salesforce environment</label><select id="connect-env"><option>Production</option><option>Sandbox</option></select></div><div class="steps"><div class="step"><span class="step-num">1</span><div><strong>Choose your Salesforce environment</strong><p>Production uses login.salesforce.com; sandbox uses test.salesforce.com.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Sign in and approve access</strong><p>You'll review and approve the requested Salesforce permissions.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Return to OrgPilot</strong><p>Your org is securely connected to this workspace.</p></div></div></div>`,`<button class="btn" id="cancel-modal">Cancel</button><button class="btn btn-primary" id="continue-connect">Continue to Salesforce</button>`);document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('continue-connect').onclick=()=>toast('Add Salesforce OAuth credentials to enable this connection.')}
  function installModal(pkg,org){const opts=orgs.map(o=>`<option ${o.name===org?'selected':''}>${esc(o.name)}</option>`).join('');modal('Install package',`Start a package installation in a connected Salesforce org.`, `<div class="notice"><strong>Demo mode.</strong> No Salesforce org will be modified. Configure Salesforce OAuth and the package version ID to enable real installs.</div><div class="field"><label>Package</label><select id="install-pkg">${packages.map(p=>`<option ${p.name===pkg?'selected':''}>${p.name} · ${p.version}</option>`).join('')}</select></div><div class="field"><label>Salesforce org</label><select id="install-org">${opts}</select></div><div class="field"><label>Package access</label><select id="install-access"><option>Admins only</option><option>All users</option></select><div class="field-help">Choose who can access the package after installation.</div></div><label class="demo-check"><input type="checkbox" id="demo-confirm" /> I understand this preview only records a demo installation.</label>`,`<button class="btn" id="cancel-modal">Cancel</button><button class="btn btn-primary" id="start-install" disabled>Start demo install</button>`);document.getElementById('cancel-modal').onclick=closeModal;const check=document.getElementById('demo-confirm'),start=document.getElementById('start-install');check.onchange=()=>start.disabled=!check.checked;start.onclick=()=>{const p=document.getElementById('install-pkg').value.split(' · ')[0],o=document.getElementById('install-org').value;installs.unshift({pkg:p,version:packages.find(x=>x.name===p).version,org:o,date:'Oct 29, 2026 · Just now',status:'In progress',user:'Jordan Davis'});localStorage.setItem('orgpilot-installs',JSON.stringify(installs));closeModal();if(page==='overview'||page==='installs')render();toast('Demo install recorded. No Salesforce changes were made.')}}
  function bind(){document.querySelectorAll('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();page=a.dataset.page;filter='';render();document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');history.replaceState(null,'','#'+page)});document.querySelectorAll('#connect-btn,#add-org-card').forEach(b=>b.onclick=connectModal);const add=document.getElementById('add-package');if(add)add.onclick=()=>toast('Package catalog editing will be available after admin setup.');document.querySelectorAll('[data-install-package]').forEach(b=>b.onclick=()=>installModal(b.dataset.installPackage));document.querySelectorAll('[data-install-to-org]').forEach(b=>b.onclick=()=>installModal('',b.dataset.installToOrg));const install=document.getElementById('install-btn');if(install)install.onclick=()=>installModal();const search=document.getElementById('search-input');if(search){search.oninput=()=>{filter=search.value;const pos=search.selectionStart;render();const next=document.getElementById('search-input');next.focus();next.setSelectionRange(pos,pos)}}const status=document.getElementById('status-filter');if(status)status.onchange=()=>{const all=installs.filter(i=>`${i.pkg} ${i.org} ${i.user} ${i.status}`.toLowerCase().includes(filter.toLowerCase()));const filtered=status.value==='All statuses'?all:all.filter(i=>i.status===status.value);const body=document.querySelector('.table tbody');body.innerHTML=filtered.length?installRows(filtered):`<tr><td colspan="6"><div class="empty-state"><h3>No installs found</h3></div></td></tr>`};const save=document.getElementById('save-settings');if(save)save.onclick=()=>toast('Workspace settings saved for this preview.');const invite=document.getElementById('invite-btn');if(invite)invite.onclick=()=>toast('Member invitations are not configured in this preview.');const docs=document.getElementById('oauth-docs');if(docs)docs.onclick=()=>toast('OAuth setup guide is coming soon.');document.querySelectorAll('.row-menu').forEach(b=>b.onclick=()=>toast('Install details are available in the full history view.'))}
  document.querySelectorAll('.nav-link').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();page=a.dataset.page;filter='';render();history.replaceState(null,'','#'+page)}));document.getElementById('menu-toggle').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show')};document.getElementById('scrim').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')};document.getElementById('notifications').onclick=()=>toast('You are all caught up.');window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(pages[next]){page=next;render()}});if(pages[location.hash.slice(1)])page=location.hash.slice(1);render();
</script>
</body>
</html>
